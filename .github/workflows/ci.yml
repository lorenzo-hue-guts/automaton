name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Run tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 300 pnpm exec vitest run --maxWorkers=2 --minWorkers=1
          RC=$?
          set -e
          # Exit code 124 means timeout killed the process (vitest hung after tests completed)
          if [ "$RC" -eq 124 ]; then echo "::error::Test command timed out; results are not a pass"; exit 124; fi
          exit $RC
      - name: Run security tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 180 pnpm exec vitest run --maxWorkers=2 --minWorkers=1 --grep "security|injection|policy|financial"
          RC=$?
          set -e
          if [ "$RC" -eq 124 ]; then echo "::error::Test command timed out; results are not a pass"; exit 124; fi
          exit $RC

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
